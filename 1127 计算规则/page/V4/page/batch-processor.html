    <script>
        // ================= 加载配置 =================
        const CONFIG = loadConfig();
        console.log('📋 批量处理器配置:', CONFIG);
        
        // 从配置读取参数
        const PV_WATT = CONFIG.pv.pmax;
        const STATE_CONSUMPTION = CONFIG.consumption;
        const INVERTER_CONFIG = CONFIG.inverter;
        const TARGET_RATIO = INVERTER_CONFIG.targetRatio / 100;
        const MAX_RATIO = INVERTER_CONFIG.maxRatio / 100;
        
        // 各州各时段用电比例 (%) - 与 equipment-recommender.html 保持一致
        const STATE_HOURLY_PROFILE = {
            'NSW': [4.427, 3.912, 3.176, 2.706, 2.583, 2.805, 3.427, 3.939, 4.089, 4.050, 3.986, 3.936, 3.948, 3.908, 3.920, 4.105, 4.569, 5.328, 5.846, 5.634, 5.329, 4.947, 4.804, 4.63],
            'VIC': [3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 4.714, 4.714, 4.714, 4.714, 4.714, 4.714, 4.714, 3.941, 3.941],
            'QLD': [2.990, 2.638, 2.405, 2.319, 2.396, 2.745, 3.486, 4.163, 4.270, 4.255, 4.252, 4.348, 4.421, 4.440, 4.486, 4.667, 5.074, 5.727, 6.229, 5.996, 5.621, 4.970, 4.421, 3.679],
            'SA': [4.850, 5.185, 3.814, 2.956, 2.568, 2.654, 3.142, 3.655, 3.563, 3.624, 4.103, 4.366, 4.188, 3.980, 3.997, 4.111, 4.525, 5.442, 5.990, 5.715, 5.315, 4.739, 3.905, 3.607],
            'WA': [2.990, 2.638, 2.405, 2.319, 2.396, 2.745, 3.486, 4.163, 4.270, 4.255, 4.252, 4.348, 4.421, 4.440, 4.486, 4.667, 5.074, 5.727, 6.229, 5.996, 5.621, 4.970, 4.421, 3.679],
            'TAS': [3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 3.941, 4.714, 4.714, 4.714, 4.714, 4.714, 4.714, 4.714, 3.941, 3.941],
            'ACT': [3.400, 3.031, 2.876, 2.867, 3.055, 3.643, 4.493, 4.904, 4.317, 3.792, 3.615, 3.118, 3.053, 2.937, 3.003, 3.369, 4.434, 5.901, 6.693, 6.550, 6.142, 5.416, 5.178, 4.208],
            'NT': [2.990, 2.638, 2.405, 2.319, 2.396, 2.745, 3.486, 4.163, 4.270, 4.255, 4.252, 4.348, 4.421, 4.440, 4.486, 4.667, 5.074, 5.727, 6.229, 5.996, 5.621, 4.970, 4.421, 3.679]
        };

        // 成本参数配置 - 从配置加载
        const COST_CONFIG = CONFIG.cost;
        
        // 成本计算函数 - 计算指定方案的成本
        // 方案 C/D 需要额外参数: state (用于计算补贴)
        function calculateCostByScheme(pvKw, inverterKw, batteryKwh, schemeType, state = null) {
            let pvCost, inverterCost, batteryCost, systemCost;
            const gstRate = COST_CONFIG.gstRate;
            
            if (schemeType === 'C') {
                // 方案C: $/kW 简化定价
                const params = COST_CONFIG.schemeC || {
                    solarOnly: { exGstExStc: 750, incGstIncStc: 600 },
                    hybridPv: { exGstExStc: 800, incGstIncStc: 650 },
                    battery: { exGstExStc: 700, incGstIncStc: 450 }
                };
                
                const isHybrid = batteryKwh > 0;
                const pvParams = isHybrid ? params.hybridPv : params.solarOnly;
                
                const pvCostExGstExStc = pvKw * pvParams.exGstExStc;
                const batteryCostExGstExStc = batteryKwh * params.battery.exGstExStc;
                const totalExGstExStc = pvCostExGstExStc + batteryCostExGstExStc;
                
                const pvCostIncGstIncStc = pvKw * pvParams.incGstIncStc;
                const batteryCostIncGstIncStc = batteryKwh * params.battery.incGstIncStc;
                const totalIncGstIncStc = pvCostIncGstIncStc + batteryCostIncGstIncStc;
                
                return {
                    pvCost: pvCostExGstExStc,
                    inverterCost: 0,
                    batteryCost: batteryCostExGstExStc,
                    systemCost: pvCostExGstExStc,
                    preTaxTotal: totalExGstExStc,
                    taxTotal: totalExGstExStc * (1 + gstRate),
                    scheme: schemeType,
                    schemeC: {
                        isHybrid,
                        exGstExStc: { pv: pvCostExGstExStc, battery: batteryCostExGstExStc, total: totalExGstExStc },
                        incGstIncStc: { pv: pvCostIncGstIncStc, battery: batteryCostIncGstIncStc, total: totalIncGstIncStc }
                    }
                };
                
            } else if (schemeType === 'D') {
                // 方案D: 分离式定价 (PV + 电池安装费 + 电池容量)
                const params = COST_CONFIG.schemeD || {
                    solarOnly: { exGstExStc: 750, incGstIncStc: 600 },
                    hybridPv: { exGstExStc: 650, incGstIncStc: 520 },
                    batteryInstallFee: { exGstExStc: 1800, incGstIncStc: 1500 },
                    batteryPerKwh: { exGstExStc: 550, incGstIncStc: 450 },
                    standardBatteries: {}
                };
                
                const isHybrid = batteryKwh > 0;
                const pvParams = isHybrid ? params.hybridPv : params.solarOnly;
                
                // 不含税不含补贴
                const pvCostExGstExStc = pvKw * pvParams.exGstExStc;
                let batteryCostExGstExStc = 0;
                let batteryInstallFeeEx = 0;
                let batteryCapacityCostEx = 0;
                
                if (isHybrid) {
                    batteryInstallFeeEx = params.batteryInstallFee.exGstExStc;
                    batteryCapacityCostEx = batteryKwh * params.batteryPerKwh.exGstExStc;
                    batteryCostExGstExStc = batteryInstallFeeEx + batteryCapacityCostEx;
                }
                const totalExGstExStc = pvCostExGstExStc + batteryCostExGstExStc;
                
                // 含税含补贴
                const pvCostIncGstIncStc = pvKw * pvParams.incGstIncStc;
                let batteryCostIncGstIncStc = 0;
                let batteryInstallFeeInc = 0;
                let batteryCapacityCostInc = 0;
                
                if (isHybrid) {
                    batteryInstallFeeInc = params.batteryInstallFee.incGstIncStc;
                    batteryCapacityCostInc = batteryKwh * params.batteryPerKwh.incGstIncStc;
                    batteryCostIncGstIncStc = batteryInstallFeeInc + batteryCapacityCostInc;
                }
                const totalIncGstIncStc = pvCostIncGstIncStc + batteryCostIncGstIncStc;
                
                return {
                    pvCost: pvCostExGstExStc,
                    inverterCost: 0,
                    batteryCost: batteryCostExGstExStc,
                    systemCost: pvCostExGstExStc,
                    preTaxTotal: totalExGstExStc,
                    taxTotal: totalExGstExStc * (1 + gstRate),
                    scheme: schemeType,
                    schemeD: {
                        isHybrid,
                        exGstExStc: { pv: pvCostExGstExStc, batteryInstall: batteryInstallFeeEx, batteryCapacity: batteryCapacityCostEx, battery: batteryCostExGstExStc, total: totalExGstExStc },
                        incGstIncStc: { pv: pvCostIncGstIncStc, batteryInstall: batteryInstallFeeInc, batteryCapacity: batteryCapacityCostInc, battery: batteryCostIncGstIncStc, total: totalIncGstIncStc }
                    }
                };
                
            } else if (schemeType === 'B') {
                // 方案B: 基准+增量定价
                const params = COST_CONFIG.schemeB || {};
                const baseKw = params.baseKw || 6.6;
                const basePrice = params.basePrice || 4500;
                const adderPrice = params.adderPricePerKw || 500;
                const batteryInstallFee = params.batteryInstallFee || 1500;
                const batteryUnitCost = params.batteryPerKwh || 700;
                
                // 光伏系统价格 (包含逆变器)
                if (pvKw <= baseKw) {
                    systemCost = (pvKw / baseKw) * basePrice;
                } else {
                    const extraKw = pvKw - baseKw;
                    systemCost = basePrice + (extraKw * adderPrice);
                }
                
                // 电池价格
                if (batteryKwh > 0) {
                    batteryCost = batteryInstallFee + (batteryKwh * batteryUnitCost);
                } else {
                    batteryCost = 0;
                }
                
                // 方案B中，pvCost和inverterCost合并为systemCost，这里按比例拆分用于显示
                pvCost = systemCost * 0.7;
                inverterCost = systemCost * 0.3;
                
            } else {
                // 方案A: 线性定价
                const params = COST_CONFIG.schemeA || {
                    pvPerKw: COST_CONFIG.pvPerKw || 540,
                    inverterPerKw: COST_CONFIG.inverterPerKw || 280,
                    batteryPerKwh: COST_CONFIG.batteryPerKwh || 865
                };
                pvCost = pvKw * params.pvPerKw;
                inverterCost = inverterKw * params.inverterPerKw;
                batteryCost = batteryKwh * params.batteryPerKwh;
                systemCost = pvCost + inverterCost;
            }
            
            const preTaxTotal = systemCost + batteryCost;
            const taxTotal = preTaxTotal * (1 + gstRate);
            
            return {
                pvCost,
                inverterCost,
                batteryCost,
                systemCost,
                preTaxTotal,
                taxTotal,
                scheme: schemeType
            };
        }
        
        // 同时计算四套方案的成本
        function calculateCostBothSchemes(pvKw, inverterKw, batteryKwh, state = null) {
            return {
                schemeA: calculateCostByScheme(pvKw, inverterKw, batteryKwh, 'A'),
                schemeB: calculateCostByScheme(pvKw, inverterKw, batteryKwh, 'B'),
                schemeC: calculateCostByScheme(pvKw, inverterKw, batteryKwh, 'C', state),
                schemeD: calculateCostByScheme(pvKw, inverterKw, batteryKwh, 'D', state)
            };
        }

        // 电池硬件参数 - 从配置加载
        const BATTERY_PARAMS = {
            dod: CONFIG.battery.dod || 0.9,
            rte: CONFIG.battery.rte || 0.9
        };

        // ================= V4: 兜底发电/用电分布参数 =================
        const PV_MONTHLY_SHARE = {
            1: 0.10,
            2: 0.09,
            3: 0.09,
            4: 0.08,
            5: 0.07,
            6: 0.06,
            7: 0.07,
            8: 0.08,
            9: 0.09,
            10: 0.09,
            11: 0.09,
            12: 0.09
        };

        const PV_HOURLY_SHARE = [
            0, 0, 0, 0, 0, 0,
            0.02, 0.04, 0.07, 0.10, 0.13, 0.14, 0.14, 0.13, 0.10, 0.07, 0.04, 0.02,
            0, 0, 0, 0, 0, 0
        ];

        const LOAD_MONTHLY_SHARE = {
            TAS: [0.0855, 0.0778, 0.0751, 0.0714, 0.0847, 0.1055, 0.1067, 0.0945, 0.0736, 0.0721, 0.0730, 0.0803],
            VIC: [0.0855, 0.0778, 0.0751, 0.0714, 0.0847, 0.1055, 0.1067, 0.0945, 0.0736, 0.0721, 0.0730, 0.0803],
            NSW: [0.0855, 0.0778, 0.0751, 0.0714, 0.0847, 0.1055, 0.1067, 0.0945, 0.0736, 0.0721, 0.0730, 0.0803],
            SA:  [0.0855, 0.0778, 0.0751, 0.0714, 0.0847, 0.1055, 0.1067, 0.0945, 0.0736, 0.0721, 0.0730, 0.0803],
            WA:  [0.0855, 0.0778, 0.0751, 0.0714, 0.0847, 0.1055, 0.1067, 0.0945, 0.0736, 0.0721, 0.0730, 0.0803],
            ACT: [0.0855, 0.0778, 0.0751, 0.0714, 0.0847, 0.1055, 0.1067, 0.0945, 0.0736, 0.0721, 0.0730, 0.0803],
            NT:  [0.0855, 0.0778, 0.0751, 0.0714, 0.0847, 0.1055, 0.1067, 0.0945, 0.0736, 0.0721, 0.0730, 0.0803],
            QLD: [0.0927, 0.0922, 0.0869, 0.0814, 0.0790, 0.0823, 0.0819, 0.0793, 0.0760, 0.0767, 0.0819, 0.0896]
        };

        function getAnnualYieldByState(state) {
            const safeState = STATE_CONSUMPTION[state] ? state : 'NSW';
            const map = CONFIG.pv?.annualYieldByState;
            if (map && typeof map[safeState] === 'number') return map[safeState];
            const fallback = CONFIG.pv?.annualKwhPerKw;
            if (typeof fallback === 'number') return fallback;
            return 1460;
        }

        function calculateV4EnergyDimensions(pvKw, state) {
            const safeState = STATE_CONSUMPTION[state] ? state : 'NSW';
            const annualConsumption = STATE_CONSUMPTION[safeState] || 7778;

            // STATE_HOURLY_PROFILE 是百分比格式(加总=100)，与 equipment-recommender.html 一致
            const hourlyProfilePct = STATE_HOURLY_PROFILE[safeState] || STATE_HOURLY_PROFILE['NSW'];
            const juneMonthIndex = 6;
            const juneDays = 30;

            const loadMonthShares = LOAD_MONTHLY_SHARE[safeState] || LOAD_MONTHLY_SHARE['NSW'];
            const loadJune = annualConsumption * (loadMonthShares[juneMonthIndex - 1] || 0);
            const loadDay = loadJune / juneDays;
            const loadHour = hourlyProfilePct.map(pct => loadDay * (pct / 100));

            const annualYield = getAnnualYieldByState(safeState);
            const pvAnnual = pvKw * annualYield;
            const pvJune = pvAnnual * (PV_MONTHLY_SHARE[juneMonthIndex] || 0);
            const pvDay = pvJune / juneDays;
            const pvHour = PV_HOURLY_SHARE.map(r => pvDay * r);

            const eveningHours = [17, 18, 19, 20];
            const nightHours = [17, 18, 19, 20, 21, 22, 23, 0, 1, 2, 3, 4, 5, 6];
            const eveningKwh = eveningHours.reduce((sum, h) => sum + (loadHour[h] || 0), 0);
            const nightKwh = nightHours.reduce((sum, h) => sum + (loadHour[h] || 0), 0);
            const surplusKwh = pvHour.reduce((sum, pv, h) => sum + Math.max(0, pv - (loadHour[h] || 0)), 0);

            return { pvDay, loadDay, eveningKwh, nightKwh, surplusKwh };
        }

        // 补贴参数配置 - 从配置加载
        const SUBSIDY_CONFIG = CONFIG.subsidy;

        function calculateRoofScore(aspect) {
            const north = 0;
            let diff = Math.abs(aspect - north);
            if (diff > 180) diff = 360 - diff;
            const score = Math.max(0, 100 - (diff / 180) * 100);
            return score;
        }

        function formatKwValue(value) {
            if (value === undefined || value === null || isNaN(value)) return '0';
            return Number.isInteger(value) ? value.toString() : value.toFixed(1);
        }

        function getPhaseLabel(phaseType) {
            return phaseType === 'single' ? '单相' : '三相';
        }

        function getPhaseMaxLimit(phaseType) {
            return phaseType === 'single' ? (INVERTER_CONFIG.singleMaxKw ?? 10) : (INVERTER_CONFIG.threeMaxKw ?? 30);
        }

        function getInverterOptions(planKey, phaseType) {
            const useOptions = phaseType === 'single'
                ? !!INVERTER_CONFIG.enableSingleOptions
                : !!INVERTER_CONFIG.enableThreeOptions;
            const baseOptions = phaseType === 'single'
                ? (INVERTER_CONFIG.single[planKey] || [])
                : (INVERTER_CONFIG.three[planKey] || []);
            const phaseMax = getPhaseMaxLimit(phaseType);
            const filtered = baseOptions.filter(size => size <= phaseMax);
            let options = useOptions ? filtered : [phaseMax];
            let injectedLimit = false;
            if (options.length === 0) {
                if (baseOptions.length > 0) {
                    options = [Math.min(phaseMax, baseOptions[baseOptions.length - 1])];
                } else {
                    options = [phaseMax];
                }
                injectedLimit = true;
            }
            return {
                options,
                baseOptions,
                phaseMax,
                limitInjected: injectedLimit,
                limitedByConfig: useOptions && baseOptions.some(size => size > phaseMax),
                enforceList: useOptions
            };
        }

        function buildInverterDetail(meta) {
            if (!meta) return '';
            const parts = [`原始推导 ${formatKwValue(meta.rawKw)}kW`];
            if (meta.limitedByPhase) {
                parts.push(`受${meta.phaseLabel}上限 ${meta.phaseMax}kW 限制`);
            } else if (meta.limitedByConfig) {
                parts.push(`受可选规格上限 ${meta.availableMax}kW 限制`);
            }

            if (meta.adjustmentReason === 'inverterUpgrade') {
                parts.push('为满足容配比要求已提升逆变器规格');
            } else if (meta.adjustmentReason === 'panelReduction') {
                parts.push('为满足容配比要求已限制光伏功率');
            } else if (!meta.limitedByPhase && !meta.limitedByConfig && meta.finalKw !== meta.rawKw) {
                if (meta.finalKw > meta.rawKw) parts.push('按规格向上取整');
            }

            parts.push(`最终采用 ${formatKwValue(meta.finalKw)}kW`);
            return parts.join('，');
        }

        function selectInverterForPlan(planKey, phaseType, requiredKw, rawKw = requiredKw) {
            const optionsInfo = getInverterOptions(planKey, phaseType);
            const options = optionsInfo.options;
            const availableMax = optionsInfo.enforceList && options.length
                ? options[options.length - 1]
                : optionsInfo.phaseMax;
            let selected;
            if (optionsInfo.enforceList && options.length) {
                selected = options.find(s => s >= requiredKw) || availableMax;
            } else {
                selected = Math.min(Math.max(Math.ceil(requiredKw), 1), optionsInfo.phaseMax);
            }
            const baseMax = optionsInfo.baseOptions && optionsInfo.baseOptions.length
                ? optionsInfo.baseOptions[optionsInfo.baseOptions.length - 1]
                : availableMax;
            const meta = {
                rawKw,
                requiredKw,
                finalKw: selected,
                phaseMax: optionsInfo.phaseMax,
                phaseLabel: getPhaseLabel(phaseType),
                availableMax,
                baseMax,
                limitedByPhase: rawKw > optionsInfo.phaseMax,
                limitedByConfig: rawKw <= optionsInfo.phaseMax && rawKw > availableMax,
                limitInjected: optionsInfo.limitInjected,
                adjustmentReason: null
            };
            return { kw: selected, meta, optionsInfo };
        }

        function applyInverterRules(result, planKey, phaseType) {
            const rawRequirement = result.totalKw / TARGET_RATIO;
            let { kw, meta, optionsInfo } = selectInverterForPlan(planKey, phaseType, Math.ceil(rawRequirement), rawRequirement);
            let ratio = (result.totalKw / kw) * 100;

            if (ratio > INVERTER_CONFIG.maxRatio) {
                const minInvForCompliance = Math.ceil(result.totalKw / MAX_RATIO);
                const upgradedSelection = selectInverterForPlan(planKey, phaseType, minInvForCompliance, meta.rawKw);
                if (upgradedSelection.kw > kw) {
                    kw = upgradedSelection.kw;
                    meta = upgradedSelection.meta;
                    optionsInfo = upgradedSelection.optionsInfo;
                    meta.adjustmentReason = 'inverterUpgrade';
                    ratio = (result.totalKw / kw) * 100;
                } else {
                    const maxInv = optionsInfo.options[optionsInfo.options.length - 1];
                    const maxAllowedKw = maxInv * MAX_RATIO;
                    if (result.totalKw > maxAllowedKw) {
                        result.totalKw = maxAllowedKw;
                        result.count = Math.floor((maxAllowedKw * 1000) / PV_WATT);
                    }
                    kw = maxInv;
                    meta.adjustmentReason = 'panelReduction';
                    ratio = (result.totalKw / kw) * 100;
                }
            }

            meta.finalKw = kw;
            meta.detail = buildInverterDetail(meta);
            return { kw, meta, ratio: ratio.toFixed(0) };
        }

        function createPlanResult(typeLabel, result, inverterInfo, battery, subsidy) {
            const pvKw = result.totalKw;
            const inverterKw = inverterInfo.kw;
            const batteryKwh = battery.standard;
            
            // 同时计算两套成本方案
            const costs = calculateCostBothSchemes(pvKw, inverterKw, batteryKwh);
            
            // 方案A (线性) 计算
            const finalPriceA = costs.schemeA.taxTotal - subsidy.subsidyAmount;
            const pricePerKwA = pvKw > 0 ? finalPriceA / pvKw : 0;
            
            // 方案B (套餐) 计算
            const finalPriceB = costs.schemeB.taxTotal - subsidy.subsidyAmount;
            const pricePerKwB = pvKw > 0 ? finalPriceB / pvKw : 0;
            
            return {
                type: typeLabel,
                pvKw_value: result.totalKw,
                pvKw_unit: 'kW',
                panels: result.count,
                inverter_raw_value: inverterInfo.meta.rawKw,
                inverter_value: inverterInfo.kw,
                inverter_unit: 'kW',
                inverter_detail: inverterInfo.meta.detail,
                ratio_value: parseInt(inverterInfo.ratio, 10),
                ratio_unit: '%',
                battery_value: battery.standard,
                battery_unit: 'kWh',
                battery_method: battery.methodDesc,
                subsidy_value: Math.round(subsidy.subsidyAmount),
                subsidy_unit: 'AUD',
                // 定价方案A (线性)
                taxTotalA_value: Math.round(costs.schemeA.taxTotal),
                taxTotalA_unit: 'AUD',
                finalPriceA_value: Math.round(finalPriceA),
                finalPriceA_unit: 'AUD',
                pricePerKwA_value: Math.round(pricePerKwA),
                pricePerKwA_unit: 'AUD/kW',
                // 定价方案B (套餐)
                taxTotalB_value: Math.round(costs.schemeB.taxTotal),
                taxTotalB_unit: 'AUD',
                finalPriceB_value: Math.round(finalPriceB),
                finalPriceB_unit: 'AUD',
                pricePerKwB_value: Math.round(pricePerKwB),
                pricePerKwB_unit: 'AUD/kW',
                // 差异
                priceDiff_value: Math.round(finalPriceA - finalPriceB),
                priceDiff_unit: 'AUD',
                usedPlanes: result.usedPlanes ? result.usedPlanes.length : 0
            };
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const houses = {};
            
            for (let i = 1; i < lines.length; i++) {
                const parts = lines[i].split(',');
                if (parts.length < 4) continue;
                
                const houseId = parts[0].trim();
                const slopeId = parts[1].trim();
                const aspect = parseFloat(parts[2]);
                const nums = parseInt(parts[3]);
                
                if (!houses[houseId]) houses[houseId] = [];
                
                houses[houseId].push({
                    id: slopeId,
                    aspect: aspect,
                    max: nums,
                    score: calculateRoofScore(aspect)
                });
            }
            
            return houses;
        }

        function calculateBatteryCapacity(pvKw, state, type) {
            const dims = calculateV4EnergyDimensions(pvKw, state);
            const RTE = CONFIG.battery.rte || 0.95;
            const DOD = CONFIG.battery.dod || 0.9;
            const efficiency = RTE * DOD;

            const maxCap = CONFIG.battery.maxCapacity || 50;
            const minCap = CONFIG.battery.minCapacity || 5;

            const aSurplus = (typeof CONFIG.battery?.v4?.aSurplus === 'number') ? CONFIG.battery.v4.aSurplus : 0.8;
            const bSurplus = (typeof CONFIG.battery?.v4?.bSurplus === 'number') ? CONFIG.battery.v4.bSurplus : 0.5;

            let targetEnergy = 0;
            let methodDesc = '';
            let method1 = 0;
            let method2 = 0;
            let method3 = 0;

            if (type === 'premium') {
                method1 = dims.nightKwh;
                method2 = aSurplus * dims.surplusKwh;
                targetEnergy = Math.max(method1, method2);
                methodDesc = `A: max(整夜, ${aSurplus}×剩余)`;
            } else if (type === 'economy') {
                method1 = dims.eveningKwh;
                targetEnergy = method1;
                methodDesc = 'C: 晚高峰';
            } else {
                method1 = dims.eveningKwh;
                method2 = bSurplus * dims.surplusKwh;
                targetEnergy = Math.max(method1, method2);
                methodDesc = `B: max(晚高峰, ${bSurplus}×剩余)`;
            }

            const safeTargetEnergy = Number.isFinite(targetEnergy) ? targetEnergy : 0;
            let capacity = safeTargetEnergy > 0 ? safeTargetEnergy / efficiency : 0;

            if (capacity > 0) {
                capacity = Math.max(minCap, Math.min(maxCap, capacity));
            }

            let finalCapacity = capacity;
            if (CONFIG.battery.useStandards && capacity > 0) {
                const standards = CONFIG.battery.standards || [5, 6.5, 9.6, 10, 13.5, 16, 20, 25, 30, 40, 50];
                finalCapacity = standards.find(s => s >= capacity) || maxCap;
            }

            return {
                method1: method1.toFixed(2),
                method2: method2.toFixed(2),
                method3: method3.toFixed(2),
                recommended: safeTargetEnergy.toFixed(2),
                standard: finalCapacity,
                calculated: capacity,
                methodDesc
            };
        }

        function fillRoof(sortedPlanes, targetKw) {
            const neededPanels = Math.ceil((targetKw * 1000) / PV_WATT);
            let currentPanels = 0;
            let usedPlanes = [];
            
            for (let p of sortedPlanes) {
                if (p.max === 0) continue;
                let remainingNeed = neededPanels - currentPanels;
                if (remainingNeed <= 0) break;
                
                let take = Math.min(p.max, remainingNeed);
                currentPanels += take;
                usedPlanes.push({ id: p.id, count: take, score: p.score });
            }
            
            return {
                count: currentPanels,
                totalKw: currentPanels * PV_WATT / 1000,
                usedPlanes: usedPlanes
            };
        }

        // 补贴计算函数
        function calculateSubsidy(pvKw, batteryNominalKwh, state) {
            const deemingPeriod = SUBSIDY_CONFIG.deemingEndYear - SUBSIDY_CONFIG.installYear + 1;
            const zoneRating = SUBSIDY_CONFIG.zoneRating[state];
            
            // PV STC
            const pvStc = Math.floor(pvKw * zoneRating * deemingPeriod);
            
            // Battery STC - 使用可用容量 (标称容量 × DoD)
            const usableCapacity = batteryNominalKwh * BATTERY_PARAMS.dod;
            const cappedUsableCapacity = Math.min(usableCapacity, SUBSIDY_CONFIG.batteryCapacityCap);
            const batteryStc = Math.floor(cappedUsableCapacity * SUBSIDY_CONFIG.batteryStcFactor);
            
            // 总补贴
            const totalStc = pvStc + batteryStc;
            const subsidyAmount = totalStc * SUBSIDY_CONFIG.stcPrice;
            
            return {
                deemingPeriod,
                zoneRating,
                pvStc,
                batteryStc,
                totalStc,
                subsidyAmount,
                usableCapacity
            };
        }

        function generateProposals(houseId, roofData, state, phaseType, calcMode = 'new') {
            const roofPlanes = roofData.map(p => ({...p})).sort((a, b) => b.score - a.score);
            
            // 储能扩容模式：应用屋顶容量系数
            if (calcMode === 'expansion') {
                const roofCapacityFactor = CONFIG.expansion?.roofCapacityFactor || 0.7;
                roofPlanes.forEach(p => {
                    p.max = Math.floor(p.max * roofCapacityFactor);
                });
            }
            
            // 检查是否有可用空间
            const totalMaxPanels = roofPlanes.reduce((sum, p) => sum + p.max, 0);
            if (totalMaxPanels === 0) {
                // 没有可用空间，返回空方案
                return {
                    houseId,
                    state,
                    phaseType,
                    roofSummary: {
                        totalPlanes: roofPlanes.length,
                        validPlanes: 0,
                        totalMaxPanels: 0,
                        totalMaxKw: '0.00',
                        error: '无可用屋顶空间'
                    },
                    planA: { type: '高端型', pvKw: '0.00', panels: 0, inverter: 'N/A', ratio: 'N/A', battery: 'N/A', usedPlanes: 0 },
                    planB: { type: '平衡型', pvKw: '0.00', panels: 0, inverter: 'N/A', ratio: 'N/A', battery: 'N/A', usedPlanes: 0 },
                    planC: { type: '经济型', pvKw: '0.00', panels: 0, inverter: 'N/A', ratio: 'N/A', battery: 'N/A', usedPlanes: 0 }
                };
            }
            
            const totalMaxKw = roofPlanes.reduce((sum, p) => sum + (p.max * PV_WATT / 1000), 0);

            // 方案A: 高端型 (满铺)
            const resultA = fillRoof(roofPlanes, 999);
            const inverterA = applyInverterRules(resultA, 'a', phaseType);
            const batteryA = calculateBatteryCapacity(resultA.totalKw, state, 'premium');

            // 方案B: 平衡型 (10-13kW)
            const targetKwB = totalMaxKw > 15 ? 13.2 : 10.0;
            const resultB = fillRoof(roofPlanes, targetKwB);
            const inverterB = applyInverterRules(resultB, 'b', phaseType);
            const batteryB = calculateBatteryCapacity(resultB.totalKw, state, 'balanced');

            // 方案C: 经济型 (6.6kW)
            const resultC = fillRoof(roofPlanes, 6.6);
            const inverterC = applyInverterRules(resultC, 'c', phaseType);
            const batteryC = calculateBatteryCapacity(resultC.totalKw, state, 'economy');

            // 计算补贴
            const subsidyA = calculateSubsidy(resultA.totalKw, batteryA.standard, state);
            const subsidyB = calculateSubsidy(resultB.totalKw, batteryB.standard, state);
            const subsidyC = calculateSubsidy(resultC.totalKw, batteryC.standard, state);

            return {
                houseId,
                state,
                phaseType,
                roofSummary: {
                    totalPlanes: roofPlanes.length,
                    validPlanes: roofPlanes.filter(p => p.max > 0).length,
                    totalMaxPanels: roofPlanes.reduce((sum, p) => sum + p.max, 0),
                    totalMaxKw: totalMaxKw.toFixed(2)
                },
                planA: createPlanResult('高端型', resultA, inverterA, batteryA, subsidyA),
                planB: createPlanResult('平衡型', resultB, inverterB, batteryB, subsidyB),
                planC: createPlanResult('经济型', resultC, inverterC, batteryC, subsidyC)
            };
        }

        // UI事件处理
        let allResults = [];
        
        // 计算模式切换
        document.getElementById('calcMode').addEventListener('change', (e) => {
            const mode = e.target.value;
            const hint = document.getElementById('calcModeHint');
            const roofFactor = CONFIG.expansion?.roofCapacityFactor || 0.7;
            if (mode === 'expansion') {
                hint.textContent = `储能扩容：使用${(roofFactor * 100).toFixed(0)}%屋顶容量（可在配置中修改）`;
            } else {
                hint.textContent = '新建系统：使用全部屋顶容量';
            }
        });
        
        document.getElementById('processBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('csvFile');
            if (!fileInput.files[0]) {
                alert('请先上传CSV文件');
                return;
            }
            
            const state = document.getElementById('state').value;
            const phase = document.getElementById('phase').value;
            const calcMode = document.getElementById('calcMode').value;
            
            const text = await fileInput.files[0].text();
            const houses = parseCSV(text);
            const houseIds = Object.keys(houses);
            
            document.getElementById('progress').classList.remove('hidden');
            allResults = [];
            
            for (let i = 0; i < houseIds.length; i++) {
                const houseId = houseIds[i];
                const result = generateProposals(houseId, houses[houseId], state, phase, calcMode);
                allResults.push(result);
                
                const progress = ((i + 1) / houseIds.length * 100).toFixed(0);
                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('progressText').textContent = 
                    `处理中: ${i + 1}/${houseIds.length} (${progress}%)`;
                
                await new Promise(resolve => setTimeout(resolve, 10));
            }
            
            displayResults();
        });
        
        function displayResults() {
            document.getElementById('results').classList.remove('hidden');
            
            let html = '<table class="w-full text-sm border-collapse"><thead><tr class="bg-gray-200">';
            html += '<th class="border p-2">房屋ID</th>';
            html += '<th class="border p-2">方案</th>';
            html += '<th class="border p-2">PV容量</th>';
            html += '<th class="border p-2">面板数</th>';
            html += '<th class="border p-2">逆变器原始功率</th>';
            html += '<th class="border p-2">逆变器最终功率</th>';
            html += '<th class="border p-2">逆变器说明</th>';
            html += '<th class="border p-2">容配比</th>';
            html += '<th class="border p-2">电池</th>';
            html += '<th class="border p-2 bg-green-100">补贴</th>';
            html += '<th class="border p-2 bg-blue-100">定价A含税</th>';
            html += '<th class="border p-2 bg-blue-200">定价A最终</th>';
            html += '<th class="border p-2 bg-blue-100">定价A kW单价</th>';
            html += '<th class="border p-2 bg-green-100">定价B含税</th>';
            html += '<th class="border p-2 bg-green-200">定价B最终</th>';
            html += '<th class="border p-2 bg-green-100">定价B kW单价</th>';
            html += '<th class="border p-2 bg-yellow-100">差异</th>';
            html += '</tr></thead><tbody>';
            
            allResults.forEach(r => {
                ['planA', 'planB', 'planC'].forEach(plan => {
                    const p = r[plan];
                    html += `<tr class="hover:bg-gray-50">`;
                    html += `<td class="border p-2">${r.houseId}</td>`;
                    html += `<td class="border p-2">${p.type}</td>`;
                    html += `<td class="border p-2">${p.pvKw_value ? p.pvKw_value.toFixed(2) : '0.00'} ${p.pvKw_unit || 'kW'}</td>`;
                    html += `<td class="border p-2">${p.panels || 0}</td>`;
                    html += `<td class="border p-2">${typeof p.inverter_raw_value === 'number' ? formatKwValue(p.inverter_raw_value) : 'N/A'} ${p.inverter_unit || 'kW'}</td>`;
                    html += `<td class="border p-2">${typeof p.inverter_value === 'number' ? formatKwValue(p.inverter_value) : (p.inverter_value || 'N/A')} ${p.inverter_unit || 'kW'}</td>`;
                    html += `<td class="border p-2 text-gray-600">${p.inverter_detail || '-'}</td>`;
                    html += `<td class="border p-2">${p.ratio_value || 0}${p.ratio_unit || '%'}</td>`;
                    html += `<td class="border p-2">${p.battery_value ? p.battery_value.toFixed(1) : '0.0'} ${p.battery_unit || 'kWh'}</td>`;
                    html += `<td class="border p-2 bg-green-50">$${p.subsidy_value ? p.subsidy_value.toLocaleString() : '0'}</td>`;
                    // 定价方案A (线性)
                    html += `<td class="border p-2 bg-blue-50">$${p.taxTotalA_value ? p.taxTotalA_value.toLocaleString() : '0'}</td>`;
                    html += `<td class="border p-2 bg-blue-100 font-bold">$${p.finalPriceA_value ? p.finalPriceA_value.toLocaleString() : '0'}</td>`;
                    html += `<td class="border p-2 bg-blue-50">$${p.pricePerKwA_value ? p.pricePerKwA_value.toLocaleString() : '0'}/kW</td>`;
                    // 定价方案B (套餐)
                    html += `<td class="border p-2 bg-green-50">$${p.taxTotalB_value ? p.taxTotalB_value.toLocaleString() : '0'}</td>`;
                    html += `<td class="border p-2 bg-green-100 font-bold">$${p.finalPriceB_value ? p.finalPriceB_value.toLocaleString() : '0'}</td>`;
                    html += `<td class="border p-2 bg-green-50">$${p.pricePerKwB_value ? p.pricePerKwB_value.toLocaleString() : '0'}/kW</td>`;
                    // 差异
                    const diff = p.priceDiff_value || 0;
                    const diffClass = diff > 0 ? 'text-green-600' : diff < 0 ? 'text-red-600' : '';
                    html += `<td class="border p-2 bg-yellow-50 ${diffClass}">${diff > 0 ? '+' : ''}$${diff.toLocaleString()}</td>`;
                    html += `</tr>`;
                });
            });
            
            html += '</tbody></table>';
            document.getElementById('resultsSummary').innerHTML = html;
        }
        
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(allResults, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `solar_proposals_${new Date().getTime()}.json`;
            a.click();
        });
        
        document.getElementById('downloadCsvBtn').addEventListener('click', () => {
            // CSV表头 - 数值和单位分离，包含两套定价方案
            let csv = '房屋ID,州,电网相位,方案类型,';
            csv += 'PV容量(数值),PV容量单位,面板数量,';
            csv += '逆变器原始功率(数值),逆变器最终功率(数值),逆变器单位,逆变器说明,容配比(数值),容配比单位,';
            csv += '电池容量(数值),电池单位,';
            csv += '补贴(数值),补贴单位,';
            csv += '定价A含税价,定价A最终报价,定价A_kW单价,';
            csv += '定价B含税价,定价B最终报价,定价B_kW单价,';
            csv += '价格差异(A-B),';
            csv += '使用坡面数\n';
            
            allResults.forEach(r => {
                ['planA', 'planB', 'planC'].forEach(plan => {
                    const p = r[plan];
                    csv += `${r.houseId},${r.state},${r.phaseType},${p.type},`;
                    csv += `${p.pvKw_value ? p.pvKw_value.toFixed(2) : '0.00'},${p.pvKw_unit || 'kW'},${p.panels || 0},`;
                    csv += `${p.inverter_raw_value ?? 'N/A'},${p.inverter_value ?? 'N/A'},${p.inverter_unit || 'kW'},"${(p.inverter_detail || '').replace(/"/g, '""')}",${p.ratio_value || 0},${p.ratio_unit || '%'},`;
                    csv += `${p.battery_value ? p.battery_value.toFixed(1) : '0.0'},${p.battery_unit || 'kWh'},`;
                    csv += `${p.subsidy_value || 0},AUD,`;
                    csv += `${p.taxTotalA_value || 0},${p.finalPriceA_value || 0},${p.pricePerKwA_value || 0},`;
                    csv += `${p.taxTotalB_value || 0},${p.finalPriceB_value || 0},${p.pricePerKwB_value || 0},`;
                    csv += `${p.priceDiff_value || 0},`;
                    csv += `${p.usedPlanes || 0}\n`;
                });
            });
            
            const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `solar_proposals_complete_${new Date().getTime()}.csv`;
            a.click();
        });
    </script>
