<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量方案生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-50">
    <!-- 顶部导航 -->
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-blue-600">☀️ SolarFit Pro</span>

                </div>
                <div class="flex items-center space-x-4">

    <div class="max-w-6xl mx-auto p-8">
        <h1 class="text-3xl font-bold mb-6">光伏方案批量生成器</h1>
        
        <!-- CSV上传 -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">1. 上传CSV文件</h2>
            <input type="file" id="csvFile" accept=".csv" class="mb-4">
            <p class="text-sm text-gray-600">CSV格式: id_0, slope, aspect, nums</p>
        </div>
        
        <!-- 参数设置 -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">2. 设置参数</h2>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">州/领地</label>
                    <select id="state" class="w-full border rounded p-2">
                        <option value="TAS">TAS (塔斯马尼亚)</option>
                        <option value="NT">NT (北领地)</option>
                        <option value="ACT">ACT (首都领地)</option>
                        <option value="SA">SA (南澳)</option>
                        <option value="NSW">NSW (新南威尔士)</option>
                        <option value="QLD">QLD (昆士兰)</option>
                        <option value="VIC">VIC (维多利亚)</option>
                        <option value="WA">WA (西澳)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">电网相位</label>
                    <select id="phase" class="w-full border rounded p-2">
                        <option value="single">单相</option>
                        <option value="three">三相</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- 处理按钮 -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <button id="processBtn" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700">
                开始批量处理
            </button>
            <div id="progress" class="mt-4 hidden">
                <div class="bg-gray-200 rounded-full h-4">
                    <div id="progressBar" class="bg-blue-600 h-4 rounded-full" style="width: 0%"></div>
                </div>
                <p id="progressText" class="text-sm text-gray-600 mt-2"></p>
            </div>
        </div>
        
        <!-- 结果展示 -->
        <div id="results" class="bg-white rounded-lg shadow p-6 hidden">
            <h2 class="text-xl font-bold mb-4">3. 处理结果</h2>
            <button id="downloadBtn" class="bg-green-600 text-white px-4 py-2 rounded mb-4 hover:bg-green-700">
                下载完整结果 (JSON)
            </button>
            <button id="downloadCsvBtn" class="bg-green-600 text-white px-4 py-2 rounded mb-4 ml-2 hover:bg-green-700">
                下载汇总表 (CSV)
            </button>
            <div id="resultsSummary" class="overflow-x-auto"></div>
        </div>
    </div>

    <script>
        // ================= 加载配置 =================
        const CONFIG = loadConfig();
        console.log('📋 批量处理器配置:', CONFIG);
        
        // 从配置读取参数
        const PV_WATT = CONFIG.pv.pmax;
        const STATE_CONSUMPTION = CONFIG.consumption;
        const INVERTER_CONFIG = CONFIG.inverter;
        const TARGET_RATIO = INVERTER_CONFIG.targetRatio / 100;
        const MAX_RATIO = INVERTER_CONFIG.maxRatio / 100;
        
        const HOURLY_PROFILE = {
            'TAS': [0.0238, 0.0221, 0.0205, 0.0193, 0.0189, 0.0205, 0.0267, 0.0357, 0.0402, 0.0398, 0.0390, 0.0398, 0.0414, 0.0422, 0.0426, 0.0430, 0.0471, 0.0586, 0.0614, 0.0586, 0.0520, 0.0455, 0.0373, 0.0295],
            'NT': [0.0234, 0.0217, 0.0201, 0.0189, 0.0185, 0.0201, 0.0262, 0.0350, 0.0394, 0.0390, 0.0382, 0.0390, 0.0406, 0.0414, 0.0418, 0.0422, 0.0462, 0.0574, 0.0602, 0.0574, 0.0510, 0.0446, 0.0366, 0.0289],
            'ACT': [0.0240, 0.0223, 0.0207, 0.0195, 0.0191, 0.0207, 0.0269, 0.0360, 0.0405, 0.0401, 0.0393, 0.0401, 0.0417, 0.0425, 0.0429, 0.0433, 0.0474, 0.0590, 0.0618, 0.0590, 0.0524, 0.0458, 0.0376, 0.0297],
            'SA': [0.0246, 0.0229, 0.0212, 0.0200, 0.0196, 0.0212, 0.0276, 0.0369, 0.0415, 0.0411, 0.0403, 0.0411, 0.0427, 0.0435, 0.0439, 0.0443, 0.0485, 0.0604, 0.0633, 0.0604, 0.0537, 0.0469, 0.0385, 0.0304],
            'NSW': [0.0248, 0.0230, 0.0214, 0.0201, 0.0197, 0.0214, 0.0278, 0.0372, 0.0418, 0.0414, 0.0406, 0.0414, 0.0430, 0.0438, 0.0442, 0.0446, 0.0489, 0.0609, 0.0638, 0.0609, 0.0541, 0.0473, 0.0388, 0.0307],
            'QLD': [0.0249, 0.0231, 0.0215, 0.0202, 0.0198, 0.0215, 0.0279, 0.0374, 0.0420, 0.0416, 0.0408, 0.0416, 0.0432, 0.0440, 0.0444, 0.0448, 0.0491, 0.0611, 0.0641, 0.0611, 0.0543, 0.0475, 0.0390, 0.0308],
            'VIC': [0.0252, 0.0234, 0.0217, 0.0205, 0.0201, 0.0217, 0.0283, 0.0379, 0.0426, 0.0422, 0.0414, 0.0422, 0.0438, 0.0446, 0.0450, 0.0454, 0.0498, 0.0619, 0.0649, 0.0619, 0.0550, 0.0481, 0.0395, 0.0312],
            'WA': [0.0254, 0.0236, 0.0219, 0.0206, 0.0202, 0.0219, 0.0285, 0.0381, 0.0429, 0.0425, 0.0417, 0.0425, 0.0441, 0.0449, 0.0453, 0.0457, 0.0501, 0.0623, 0.0654, 0.0623, 0.0554, 0.0484, 0.0398, 0.0314]
        };

        // 成本参数配置 - 从配置加载
        const COST_CONFIG = CONFIG.cost;

        // 电池硬件参数 - 从配置加载
        const BATTERY_PARAMS = {
            dod: CONFIG.battery.dod || 0.9,
            rte: CONFIG.battery.rte || 0.9
        };

        // 补贴参数配置 - 从配置加载
        const SUBSIDY_CONFIG = CONFIG.subsidy;

        function calculateRoofScore(aspect) {
            const north = 0;
            let diff = Math.abs(aspect - north);
            if (diff > 180) diff = 360 - diff;
            const score = Math.max(0, 100 - (diff / 180) * 100);
            return score;
        }

        function formatKwValue(value) {
            if (value === undefined || value === null || isNaN(value)) return '0';
            return Number.isInteger(value) ? value.toString() : value.toFixed(1);
        }

        function getPhaseLabel(phaseType) {
            return phaseType === 'single' ? '单相' : '三相';
        }

        function getPhaseMaxLimit(phaseType) {
            return phaseType === 'single' ? (INVERTER_CONFIG.singleMaxKw ?? 10) : (INVERTER_CONFIG.threeMaxKw ?? 30);
        }

        function getInverterOptions(planKey, phaseType) {
            const useOptions = phaseType === 'single'
                ? !!INVERTER_CONFIG.enableSingleOptions
                : !!INVERTER_CONFIG.enableThreeOptions;
            const baseOptions = phaseType === 'single'
                ? (INVERTER_CONFIG.single[planKey] || [])
                : (INVERTER_CONFIG.three[planKey] || []);
            const phaseMax = getPhaseMaxLimit(phaseType);
            const filtered = baseOptions.filter(size => size <= phaseMax);
            let options = useOptions ? filtered : [phaseMax];
            let injectedLimit = false;
            if (options.length === 0) {
                if (baseOptions.length > 0) {
                    options = [Math.min(phaseMax, baseOptions[baseOptions.length - 1])];
                } else {
                    options = [phaseMax];
                }
                injectedLimit = true;
            }
            return {
                options,
                baseOptions,
                phaseMax,
                limitInjected: injectedLimit,
                limitedByConfig: useOptions && baseOptions.some(size => size > phaseMax),
                enforceList: useOptions
            };
        }

        function buildInverterDetail(meta) {
            if (!meta) return '';
            const parts = [`原始推导 ${formatKwValue(meta.rawKw)}kW`];
            if (meta.limitedByPhase) {
                parts.push(`受${meta.phaseLabel}上限 ${meta.phaseMax}kW 限制`);
            } else if (meta.limitedByConfig) {
                parts.push(`受可选规格上限 ${meta.availableMax}kW 限制`);
            }

            if (meta.adjustmentReason === 'inverterUpgrade') {
                parts.push('为满足容配比要求已提升逆变器规格');
            } else if (meta.adjustmentReason === 'panelReduction') {
                parts.push('为满足容配比要求已限制光伏功率');
            } else if (!meta.limitedByPhase && !meta.limitedByConfig && meta.finalKw !== meta.rawKw) {
                if (meta.finalKw > meta.rawKw) parts.push('按规格向上取整');
            }

            parts.push(`最终采用 ${formatKwValue(meta.finalKw)}kW`);
            return parts.join('，');
        }

        function selectInverterForPlan(planKey, phaseType, requiredKw, rawKw = requiredKw) {
            const optionsInfo = getInverterOptions(planKey, phaseType);
            const options = optionsInfo.options;
            const availableMax = optionsInfo.enforceList && options.length
                ? options[options.length - 1]
                : optionsInfo.phaseMax;
            let selected;
            if (optionsInfo.enforceList && options.length) {
                selected = options.find(s => s >= requiredKw) || availableMax;
            } else {
                selected = Math.min(Math.max(Math.ceil(requiredKw), 1), optionsInfo.phaseMax);
            }
            const baseMax = optionsInfo.baseOptions && optionsInfo.baseOptions.length
                ? optionsInfo.baseOptions[optionsInfo.baseOptions.length - 1]
                : availableMax;
            const meta = {
                rawKw,
                requiredKw,
                finalKw: selected,
                phaseMax: optionsInfo.phaseMax,
                phaseLabel: getPhaseLabel(phaseType),
                availableMax,
                baseMax,
                limitedByPhase: rawKw > optionsInfo.phaseMax,
                limitedByConfig: rawKw <= optionsInfo.phaseMax && rawKw > availableMax,
                limitInjected: optionsInfo.limitInjected,
                adjustmentReason: null
            };
            return { kw: selected, meta, optionsInfo };
        }

        function applyInverterRules(result, planKey, phaseType) {
            const rawRequirement = result.totalKw / TARGET_RATIO;
            let { kw, meta, optionsInfo } = selectInverterForPlan(planKey, phaseType, Math.ceil(rawRequirement), rawRequirement);
            let ratio = (result.totalKw / kw) * 100;

            if (ratio > INVERTER_CONFIG.maxRatio) {
                const minInvForCompliance = Math.ceil(result.totalKw / MAX_RATIO);
                const upgradedSelection = selectInverterForPlan(planKey, phaseType, minInvForCompliance, meta.rawKw);
                if (upgradedSelection.kw > kw) {
                    kw = upgradedSelection.kw;
                    meta = upgradedSelection.meta;
                    optionsInfo = upgradedSelection.optionsInfo;
                    meta.adjustmentReason = 'inverterUpgrade';
                    ratio = (result.totalKw / kw) * 100;
                } else {
                    const maxInv = optionsInfo.options[optionsInfo.options.length - 1];
                    const maxAllowedKw = maxInv * MAX_RATIO;
                    if (result.totalKw > maxAllowedKw) {
                        result.totalKw = maxAllowedKw;
                        result.count = Math.floor((maxAllowedKw * 1000) / PV_WATT);
                    }
                    kw = maxInv;
                    meta.adjustmentReason = 'panelReduction';
                    ratio = (result.totalKw / kw) * 100;
                }
            }

            meta.finalKw = kw;
            meta.detail = buildInverterDetail(meta);
            return { kw, meta, ratio: ratio.toFixed(0) };
        }

        function createPlanResult(typeLabel, result, inverterInfo, battery, cost, subsidy, finalPrice) {
            return {
                type: typeLabel,
                pvKw_value: result.totalKw,
                pvKw_unit: 'kW',
                panels: result.count,
                inverter_raw_value: inverterInfo.meta.rawKw,
                inverter_value: inverterInfo.kw,
                inverter_unit: 'kW',
                inverter_detail: inverterInfo.meta.detail,
                ratio_value: parseInt(inverterInfo.ratio, 10),
                ratio_unit: '%',
                battery_value: battery.standard,
                battery_unit: 'kWh',
                battery_method: battery.methodDesc,
                taxTotal_value: Math.round(cost.taxTotal),
                taxTotal_unit: 'AUD',
                subsidy_value: Math.round(subsidy.subsidyAmount),
                subsidy_unit: 'AUD',
                finalPrice_value: Math.round(finalPrice),
                finalPrice_unit: 'AUD',
                usedPlanes: result.usedPlanes ? result.usedPlanes.length : 0
            };
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const houses = {};
            
            for (let i = 1; i < lines.length; i++) {
                const parts = lines[i].split(',');
                if (parts.length < 4) continue;
                
                const houseId = parts[0].trim();
                const slopeId = parts[1].trim();
                const aspect = parseFloat(parts[2]);
                const nums = parseInt(parts[3]);
                
                if (!houses[houseId]) houses[houseId] = [];
                
                houses[houseId].push({
                    id: slopeId,
                    aspect: aspect,
                    max: nums,
                    score: calculateRoofScore(aspect)
                });
            }
            
            return houses;
        }

        function calculateBatteryCapacity(pvKw, state, type) {
            const annualKwh = STATE_CONSUMPTION[state];
            const dailyKwh = annualKwh / 365;
            const profile = HOURLY_PROFILE[state];
            const eveningKwh = dailyKwh * (profile[17] + profile[18] + profile[19] + profile[20]);
            
            let method1, method2, method3, factor1, factor2, factor3;
            
            if (type === 'premium') {
                // 高端型：大容量
                factor1 = 0.5; factor2 = 2.0; factor3 = 1.5;
            } else if (type === 'balanced') {
                // 平衡型：标准配置
                factor1 = 0.3; factor2 = 1.5; factor3 = 1.0;
            } else {
                // 经济型：基础配置
                factor1 = 0.2; factor2 = 1.0; factor3 = 0.8;
            }
            
            method1 = dailyKwh * factor1;
            method2 = eveningKwh * factor2;
            method3 = pvKw * factor3;
            
            const recommended = Math.max(method1, method2, method3);
            
            // 根据配置决定是否标准化
            let finalCapacity = recommended;
            if (CONFIG.battery.useStandards) {
                const standards = CONFIG.battery.standards || [5, 6.5, 9.6, 10, 13.5, 16, 20];
                finalCapacity = standards.find(s => s >= recommended) || standards[standards.length - 1];
            }
            
            return {
                method1: method1.toFixed(2),
                method2: method2.toFixed(2),
                method3: method3.toFixed(2),
                recommended: recommended.toFixed(2),
                standard: finalCapacity,
                methodDesc: `max(日用电×${factor1}, 傍晚峰×${factor2}, PV容量×${factor3})`
            };
        }

        function fillRoof(sortedPlanes, targetKw) {
            const neededPanels = Math.ceil((targetKw * 1000) / PV_WATT);
            let currentPanels = 0;
            let usedPlanes = [];
            
            for (let p of sortedPlanes) {
                if (p.max === 0) continue;
                let remainingNeed = neededPanels - currentPanels;
                if (remainingNeed <= 0) break;
                
                let take = Math.min(p.max, remainingNeed);
                currentPanels += take;
                usedPlanes.push({ id: p.id, count: take, score: p.score });
            }
            
            return {
                count: currentPanels,
                totalKw: currentPanels * PV_WATT / 1000,
                usedPlanes: usedPlanes
            };
        }

        // 成本计算函数
        function calculateCost(pvKw, inverterKw, batteryKwh) {
            const pvCost = pvKw * COST_CONFIG.pvPerKw;
            const inverterCost = inverterKw * COST_CONFIG.inverterPerKw;
            const batteryCost = batteryKwh * COST_CONFIG.batteryPerKwh;
            const preTaxTotal = pvCost + inverterCost + batteryCost;
            const taxTotal = preTaxTotal * (1 + COST_CONFIG.gstRate);
            
            return {
                pvCost,
                inverterCost,
                batteryCost,
                preTaxTotal,
                taxTotal
            };
        }

        // 补贴计算函数
        function calculateSubsidy(pvKw, batteryNominalKwh, state) {
            const deemingPeriod = SUBSIDY_CONFIG.deemingEndYear - SUBSIDY_CONFIG.installYear + 1;
            const zoneRating = SUBSIDY_CONFIG.zoneRating[state];
            
            // PV STC
            const pvStc = Math.floor(pvKw * zoneRating * deemingPeriod);
            
            // Battery STC - 使用可用容量 (标称容量 × DoD)
            const usableCapacity = batteryNominalKwh * BATTERY_PARAMS.dod;
            const cappedUsableCapacity = Math.min(usableCapacity, SUBSIDY_CONFIG.batteryCapacityCap);
            const batteryStc = Math.floor(cappedUsableCapacity * SUBSIDY_CONFIG.batteryStcFactor);
            
            // 总补贴
            const totalStc = pvStc + batteryStc;
            const subsidyAmount = totalStc * SUBSIDY_CONFIG.stcPrice;
            
            return {
                deemingPeriod,
                zoneRating,
                pvStc,
                batteryStc,
                totalStc,
                subsidyAmount,
                usableCapacity
            };
        }

        function generateProposals(houseId, roofData, state, phaseType) {
            const roofPlanes = roofData.map(p => ({...p})).sort((a, b) => b.score - a.score);
            
            // 检查是否有可用空间
            const totalMaxPanels = roofPlanes.reduce((sum, p) => sum + p.max, 0);
            if (totalMaxPanels === 0) {
                // 没有可用空间，返回空方案
                return {
                    houseId,
                    state,
                    phaseType,
                    roofSummary: {
                        totalPlanes: roofPlanes.length,
                        validPlanes: 0,
                        totalMaxPanels: 0,
                        totalMaxKw: '0.00',
                        error: '无可用屋顶空间'
                    },
                    planA: { type: '高端型', pvKw: '0.00', panels: 0, inverter: 'N/A', ratio: 'N/A', battery: 'N/A', usedPlanes: 0 },
                    planB: { type: '平衡型', pvKw: '0.00', panels: 0, inverter: 'N/A', ratio: 'N/A', battery: 'N/A', usedPlanes: 0 },
                    planC: { type: '经济型', pvKw: '0.00', panels: 0, inverter: 'N/A', ratio: 'N/A', battery: 'N/A', usedPlanes: 0 }
                };
            }
            
            const totalMaxKw = roofPlanes.reduce((sum, p) => sum + (p.max * PV_WATT / 1000), 0);

            // 方案A: 高端型 (满铺)
            const resultA = fillRoof(roofPlanes, 999);
            const inverterA = applyInverterRules(resultA, 'a', phaseType);
            const batteryA = calculateBatteryCapacity(resultA.totalKw, state, 'premium');

            // 方案B: 平衡型 (10-13kW)
            const targetKwB = totalMaxKw > 15 ? 13.2 : 10.0;
            const resultB = fillRoof(roofPlanes, targetKwB);
            const inverterB = applyInverterRules(resultB, 'b', phaseType);
            const batteryB = calculateBatteryCapacity(resultB.totalKw, state, 'balanced');

            // 方案C: 经济型 (6.6kW)
            const resultC = fillRoof(roofPlanes, 6.6);
            const inverterC = applyInverterRules(resultC, 'c', phaseType);
            const batteryC = calculateBatteryCapacity(resultC.totalKw, state, 'economy');

            // 计算成本和补贴
            const costA = calculateCost(resultA.totalKw, inverterA.kw, batteryA.standard);
            const subsidyA = calculateSubsidy(resultA.totalKw, batteryA.standard, state);
            const finalPriceA = costA.taxTotal - subsidyA.subsidyAmount;

            const costB = calculateCost(resultB.totalKw, inverterB.kw, batteryB.standard);
            const subsidyB = calculateSubsidy(resultB.totalKw, batteryB.standard, state);
            const finalPriceB = costB.taxTotal - subsidyB.subsidyAmount;

            const costC = calculateCost(resultC.totalKw, inverterC.kw, batteryC.standard);
            const subsidyC = calculateSubsidy(resultC.totalKw, batteryC.standard, state);
            const finalPriceC = costC.taxTotal - subsidyC.subsidyAmount;

            return {
                houseId,
                state,
                phaseType,
                roofSummary: {
                    totalPlanes: roofPlanes.length,
                    validPlanes: roofPlanes.filter(p => p.max > 0).length,
                    totalMaxPanels: roofPlanes.reduce((sum, p) => sum + p.max, 0),
                    totalMaxKw: totalMaxKw.toFixed(2)
                },
                planA: createPlanResult('高端型', resultA, inverterA, batteryA, costA, subsidyA, finalPriceA),
                planB: createPlanResult('平衡型', resultB, inverterB, batteryB, costB, subsidyB, finalPriceB),
                planC: createPlanResult('经济型', resultC, inverterC, batteryC, costC, subsidyC, finalPriceC)
            };
        }

        // UI事件处理
        let allResults = [];
        
        document.getElementById('processBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('csvFile');
            if (!fileInput.files[0]) {
                alert('请先上传CSV文件');
                return;
            }
            
            const state = document.getElementById('state').value;
            const phase = document.getElementById('phase').value;
            
            const text = await fileInput.files[0].text();
            const houses = parseCSV(text);
            const houseIds = Object.keys(houses);
            
            document.getElementById('progress').classList.remove('hidden');
            allResults = [];
            
            for (let i = 0; i < houseIds.length; i++) {
                const houseId = houseIds[i];
                const result = generateProposals(houseId, houses[houseId], state, phase);
                allResults.push(result);
                
                const progress = ((i + 1) / houseIds.length * 100).toFixed(0);
                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('progressText').textContent = 
                    `处理中: ${i + 1}/${houseIds.length} (${progress}%)`;
                
                await new Promise(resolve => setTimeout(resolve, 10));
            }
            
            displayResults();
        });
        
        function displayResults() {
            document.getElementById('results').classList.remove('hidden');
            
            let html = '<table class="w-full text-sm border-collapse"><thead><tr class="bg-gray-200">';
            html += '<th class="border p-2">房屋ID</th>';
            html += '<th class="border p-2">方案</th>';
            html += '<th class="border p-2">PV容量</th>';
            html += '<th class="border p-2">面板数</th>';
            html += '<th class="border p-2">逆变器原始功率</th>';
            html += '<th class="border p-2">逆变器最终功率</th>';
            html += '<th class="border p-2">逆变器说明</th>';
            html += '<th class="border p-2">容配比</th>';
            html += '<th class="border p-2">电池</th>';
            html += '<th class="border p-2 bg-blue-100">含税价</th>';
            html += '<th class="border p-2 bg-green-100">补贴</th>';
            html += '<th class="border p-2 bg-yellow-100">最终报价</th>';
            html += '</tr></thead><tbody>';
            
            allResults.forEach(r => {
                ['planA', 'planB', 'planC'].forEach(plan => {
                    const p = r[plan];
                    html += `<tr class="hover:bg-gray-50">`;
                    html += `<td class="border p-2">${r.houseId}</td>`;
                    html += `<td class="border p-2">${p.type}</td>`;
                    html += `<td class="border p-2">${p.pvKw_value ? p.pvKw_value.toFixed(2) : '0.00'} ${p.pvKw_unit || 'kW'}</td>`;
                    html += `<td class="border p-2">${p.panels || 0}</td>`;
                    html += `<td class="border p-2">${typeof p.inverter_raw_value === 'number' ? formatKwValue(p.inverter_raw_value) : 'N/A'} ${p.inverter_unit || 'kW'}</td>`;
                    html += `<td class="border p-2">${typeof p.inverter_value === 'number' ? formatKwValue(p.inverter_value) : (p.inverter_value || 'N/A')} ${p.inverter_unit || 'kW'}</td>`;
                    html += `<td class="border p-2 text-gray-600">${p.inverter_detail || '-'}</td>`;
                    html += `<td class="border p-2">${p.ratio_value || 0}${p.ratio_unit || '%'}</td>`;
                    html += `<td class="border p-2">${p.battery_value ? p.battery_value.toFixed(1) : '0.0'} ${p.battery_unit || 'kWh'}</td>`;
                    html += `<td class="border p-2 bg-blue-50">$${p.taxTotal_value ? p.taxTotal_value.toLocaleString() : '0'}</td>`;
                    html += `<td class="border p-2 bg-green-50">$${p.subsidy_value ? p.subsidy_value.toLocaleString() : '0'}</td>`;
                    html += `<td class="border p-2 bg-yellow-50 font-bold">$${p.finalPrice_value ? p.finalPrice_value.toLocaleString() : '0'}</td>`;
                    html += `</tr>`;
                });
            });
            
            html += '</tbody></table>';
            document.getElementById('resultsSummary').innerHTML = html;
        }
        
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(allResults, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `solar_proposals_${new Date().getTime()}.json`;
            a.click();
        });
        
        document.getElementById('downloadCsvBtn').addEventListener('click', () => {
            // CSV表头 - 数值和单位分离
            let csv = '房屋ID,州,电网相位,方案类型,';
            csv += 'PV容量(数值),PV容量单位,面板数量,';
            csv += '逆变器原始功率(数值),逆变器最终功率(数值),逆变器单位,逆变器说明,容配比(数值),容配比单位,';
            csv += '电池容量(数值),电池单位,';
            csv += '含税价(数值),含税价单位,补贴(数值),补贴单位,最终报价(数值),最终报价单位,';
            csv += '使用坡面数\n';
            
            allResults.forEach(r => {
                ['planA', 'planB', 'planC'].forEach(plan => {
                    const p = r[plan];
                    csv += `${r.houseId},${r.state},${r.phaseType},${p.type},`;
                    csv += `${p.pvKw_value ? p.pvKw_value.toFixed(2) : '0.00'},${p.pvKw_unit || 'kW'},${p.panels || 0},`;
                    csv += `${p.inverter_raw_value ?? 'N/A'},${p.inverter_value ?? 'N/A'},${p.inverter_unit || 'kW'},"${(p.inverter_detail || '').replace(/"/g, '""')}",${p.ratio_value || 0},${p.ratio_unit || '%'},`;
                    csv += `${p.battery_value ? p.battery_value.toFixed(1) : '0.0'},${p.battery_unit || 'kWh'},`;
                    csv += `${p.taxTotal_value || 0},${p.taxTotal_unit || 'AUD'},${p.subsidy_value || 0},${p.subsidy_unit || 'AUD'},${p.finalPrice_value || 0},${p.finalPrice_unit || 'AUD'},`;
                    csv += `${p.usedPlanes || 0}\n`;
                });
            });
            
            const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `solar_proposals_complete_${new Date().getTime()}.csv`;
            a.click();
        });
    </script>
</body>
</html>
